# littledotmcp 服务端反代模板（M6-03）
# 用途：443 HTTPS → 127.0.0.1:8890/mcp（streamable-http）
# 适用：Nginx >= 1.19（支持 streamable-http 长连接）
#
# 使用：
#   1. 将本文件放入 /etc/nginx/conf.d/littledotmcp.conf（或改 server_name 后放入 sites-available）
#   2. 证书路径改为真实证书（或使用 certbot --nginx 自动签发）
#   3. nginx -t && nginx -s reload

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;          # TODO: 改为真实域名

    # 证书（certbot 或自签；路径按实际修改）
    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 流式（SSE / streamable-http）需要关闭缓冲
    proxy_buffering off;
    proxy_request_buffering off;

    # 长连接超时：MCP 会话可能长时间空闲
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # 客户端体上限（文档/知识库导入可能较大）
    client_max_body_size 100m;

    location /mcp {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # streamable-http 的 POST 走普通请求，SSE 走 text/event-stream
        proxy_set_header Accept-Encoding   "";
        add_header Cache-Control "no-store" always;
    }

    # 管理端 Web Console（M11）：前缀匹配覆盖 /admin/、/admin/static/**、/admin/api/**
    # 复用 X-Forwarded-Proto 以便后端识别 HTTPS（ConsoleAuthMiddleware 会校验 Origin/Proto）
    location /admin {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # 管理端静态资源：显式关闭缓冲避免大文件列表页阻塞（/admin 前缀已覆盖，此处为语义说明）
    location /admin/static {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header Host $host;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name mcp.example.com;          # TODO: 改为真实域名
    return 301 https://$host$request_uri;
}
